name: One-time audited dependency lock refresh

on:
  push:
    branches:
      - fix/zardonic-website-security-hardening-20261106
    paths:
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zardonic-website-security-hardening-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate exact patched Next.js lockfile via npm
        run: npm install next@16.4.5 --save-exact --package-lock-only --ignore-scripts
      - name: Commit lockfile to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): pin patched next 16.4.5 with regenerated lockfile"
            git push origin HEAD:fix/zardonic-website-security-hardening-20261106
          fi
