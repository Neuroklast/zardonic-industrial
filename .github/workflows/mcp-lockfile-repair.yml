name: Repair MCP branch npm lockfile

on:
  push:
    branches:
      - feat/mcp-content-integration-20261029
    paths:
      - .github/workflows/mcp-lockfile-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched dependencies within existing semver ranges
        run: |
          npm ci --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=high
      - name: Validate source and build
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
          else
            git commit -m "fix(deps): upgrade vulnerable transitive npm dependencies"
            git push origin "HEAD:refs/heads/feat/mcp-content-integration-20261029"
          fi
