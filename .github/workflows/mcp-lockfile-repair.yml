name: Repair MCP branch npm lockfile

on:
  push:
    branches:
      - feat/mcp-content-integration-20261029
    paths:
      - .github/workflows/mcp-lockfile-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install specifically patched dependency versions
        run: |
          npm install --global npm@11.21.1
          npm pkg set 'overrides.undici=^7.30.1'
          npm install next@^16.4.1 dompurify@^3.4.17 zod@^4.6.6 sharp@^0.35.5 --package-lock-only --ignore-scripts --no-audit
          npm install --save-dev vitest@^4.1.12 @vitest/coverage-v8@^4.1.12 vite@^8.3.3 --package-lock-only --ignore-scripts --no-audit
          npm ci
          npm audit --audit-level=high
      - name: Validate source and build
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
          else
            git commit -m "fix(deps): upgrade vulnerable transitive npm dependencies"
            git push origin "HEAD:refs/heads/feat/mcp-content-integration-20261029"
          fi
